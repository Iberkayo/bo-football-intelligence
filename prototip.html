<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060a13">
<title>Prototip · Tüm ekranlar — BO Football Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .proto-head { padding-block: var(--s-6) var(--s-5); display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .proto-head h1 { margin-top: 12px; }
  .proto-head p { margin-top: 8px; color: var(--text-2); max-width: 64ch; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: var(--s-5); }
  .screen { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: var(--s-5); align-items: start; }
  .screen__info { position: sticky; top: 24px; padding: 22px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
  .screen__info h2 { font-size: 1.25rem; }
  .screen__info p { margin-top: 8px; font-size: 0.9rem; color: var(--text-2); }
  .screen__info ul { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 0.875rem; color: var(--text-2); }
  .screen__info li { display: flex; gap: 8px; }
  .screen__info li::before { content: ""; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; background: var(--brand); flex-shrink: 0; }
  .screen__info .btn { margin-top: 18px; width: 100%; }
  .stage { display: grid; place-items: center; padding: 28px; border-radius: var(--r-xl); border: 1px solid var(--line); background: radial-gradient(600px 300px at 50% 0%, rgba(79,140,255,.08), transparent 70%), var(--bg-2); overflow: hidden; }
  /* Masaüstü tarayıcı çerçevesi */
  .browser { width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--line-2); box-shadow: var(--shadow-3); background: #05080f; }
  .browser__bar { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; background: #0b111d; border-bottom: 1px solid var(--line); }
  .browser__dots { display: flex; gap: 6px; }
  .browser__dots i { width: 10px; height: 10px; border-radius: 50%; background: #2a3347; }
  .browser__url { flex: 1; max-width: 460px; margin: 0 auto; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #131b2e; font-size: 0.75rem; color: var(--text-3); }
  .browser__viewport { position: relative; width: 100%; aspect-ratio: 1440 / 900; overflow: hidden; }
  .browser__viewport iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; }
  /* Telefon çerçevesi */
  .phone { width: 390px; max-width: 100%; padding: 12px; border-radius: 52px; background: #0b0f18; border: 1px solid var(--line-2); box-shadow: var(--shadow-3), inset 0 0 0 2px #151b28; }
  .phone__screen { position: relative; width: 100%; aspect-ratio: 390 / 844; border-radius: 40px; overflow: hidden; background: var(--bg); padding-top: 34px; }
  .phone__status { position: absolute; top: 0; left: 0; right: 0; height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 12px; font-weight: 700; color: var(--text); background: #060a13; z-index: 1; }
  .phone__viewport { position: absolute; top: 34px; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .phone__viewport iframe { position: absolute; top: 0; left: 0; width: 390px; height: 810px; border: 0; transform-origin: 0 0; }
  .phone__notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 92px; height: 22px; border-radius: 14px; background: #000; z-index: 2; pointer-events: none; }
  .pair { display: flex; flex-direction: column; gap: 32px; align-items: center; width: 100%; }
  @media (max-width: 1100px) {
    .screen { grid-template-columns: 1fr; }
    .screen__info { position: static; }
    .pair { grid-template-columns: 1fr; justify-items: center; }
  }
</style>
</head>
<body data-page="prototip">
<a class="skip-link" href="#icerik">İçeriğe geç</a>
<header class="site-header" id="site-header"></header>

<main id="icerik" class="container" style="padding-bottom:var(--s-8)">
  <div class="proto-head">
    <div>
      <span class="eyebrow">Tasarım prototipi</span>
      <h1>BO-BET · Tüm ekranlar</h1>
      <p>Altı ekran, gerçek ve tıklanabilir sayfalar olarak çerçeve içinde çalışır. Çerçevelerin içinde gezinebilir, filtreleri deneyebilir ve maç kartlarından detaya geçebilirsiniz.</p>
    </div>
    <span class="tag tag--sample">Tüm maç verileri örnek gösterimdir</span>
  </div>

  <div class="tabs chips" role="tablist" aria-label="Ekranlar" id="tabs"></div>
  <section class="screen" id="screen" role="tabpanel"></section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<nav class="bottom-nav" id="bottom-nav" aria-label="Alt menü"></nav>

<script src="assets/js/data.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/page-prototype.js"></script>
</body>
</html>
