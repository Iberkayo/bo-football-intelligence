name: Verify BO-BET website history
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/logic-test.js
      - run: node tools/fixture-feed-test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools -p 'test_export_fixtures.py' -v
      - run: node tools/prediction-feed-test.js
      - run: node tools/paper-markets-test.js
      - run: python -m unittest discover -s tools -p 'test_export_paper_forecasts.py' -v

