name: Verify BO-BET website history
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/logic-test.js
